# Example Trusted LAN drop-in for media-core.service.
# Install as /etc/systemd/system/media-core.service.d/trusted-lan.conf
# after replacing 192.168.1.100 with the NAS LAN IP and media.home.arpa
# with the local DNS name you created. The base unit stays loopback-only.
# Plain HTTP does not encrypt the owner secret, cookies or traffic: use
# only on a trusted, firewalled home network.
[Unit]
Wants=network-online.target
After=network-online.target

[Service]
ExecStart=
ExecStart=/opt/media-core/media-core serve --state-dir /var/lib/media-core --trusted-lan --listen 192.168.1.100:8787 --lan-host media.home.arpa
